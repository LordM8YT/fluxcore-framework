# Generated by the official Fluxcore Framework txAdmin recipe.
# Documentation: https://github.com/LordM8YT/fluxcore-framework

## Server identity. These values are filled by txAdmin during deployment.
sv_hostname "{{serverName}} built with {{recipeName}}"
sets sv_projectName "[{{recipeName}}] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "fluxcore, roleplay, enhanced, deployer"
sets locale "en-US"

## Network and Cfx settings.
{{serverEndpoints}}
sv_maxclients {{maxClients}}
sv_licenseKey "{{svLicense}}"
set steam_webApiKey "none"
set resources_useSystemChat false
voice_internal

## Fluxcore requirements and defaults.
# OneSync is enabled by the recipe's $onesync setting and managed by txAdmin.
set sv_stateBagStrictMode true

# Required for Enhanced client developer tools during early-access testing.
# Disable this for production servers that do not need developer tooling.
set sv_devMode true

# Fluxcore UI language. Available out of the box: en, no.
setr fluxcore_locale "en"
set fluxcore_maxCharacters 4
set fluxcore_saveIntervalMs 60000

## Standard CFX resources.
ensure mapmanager
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure baseevents
stop chat

## Fluxcore resources. Keep this order: dependent resources start after core.
setr sv_showBusySpinnerOnLoadingScreen false
ensure fluxcore_loading
ensure fluxcore_core
ensure fluxcore_chat
ensure fluxcore_voice
ensure fluxcore_interact
ensure fluxcore_jobs
ensure fluxcore_inventory
ensure fluxcore_status
ensure fluxcore_banking
ensure fluxcore_vehicles
ensure fluxcore_fuel
ensure fluxcore_appearance
ensure fluxcore_businesses
ensure fluxcore_services
ensure fluxcore_dispatch
ensure fluxcore_mdt
ensure fluxcore_properties
ensure fluxcore_world
ensure fluxcore_ui
ensure fluxcore_admin
ensure fluxcore_phone
ensure fluxcore_identity

## The first txAdmin account is inserted here as a group.admin principal.
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin fluxcore.admin allow
add_ace group.admin fluxcore.jobs.manage allow
add_ace group.admin fluxcore.vehicles.manage allow
add_ace group.admin fluxcore.businesses.manage allow
{{addPrincipalsMaster}}
