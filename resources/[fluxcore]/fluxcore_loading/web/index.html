<!doctype html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluxcord</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <main>
        <section class="brand">
            <div class="mark">F</div>
            <p class="eyebrow">ENHANCED ROLEPLAY</p>
            <h1>FLUX<span>CORD</span></h1>
            <p class="tagline">Historien starter når byen våkner.</p>
        </section>
        <section class="loader">
            <div class="meta">
                <span id="status">Kobler til byen</span>
                <strong id="percent">0%</strong>
            </div>
            <div class="track"><div id="progress" class="progress"></div></div>
            <p id="tip">Tips: God RP handler om å gi andre noe å spille videre på.</p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
